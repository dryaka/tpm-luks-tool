[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tpm-luks-tool"
version = "0.4.0"
description = "Policy-driven TPM2-bound LUKS2 management"
readme = "README.md"
authors = [{name = "Aleš Dryák", email = "ales.dryak@volny.cz"}]
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.scripts]
tpm-luks = "tpm_luks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
