[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tpm-luks-tool"
version = "0.4.0"
description = "Policy-driven TPM2-bound LUKS2 management"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tpm-luks = "tpm_luks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
