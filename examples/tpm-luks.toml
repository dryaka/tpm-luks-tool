policy_name = "example-root"

[tpm]
device = "auto"
bank = "sha256"
pcrs = [7]

[[volume]]
name = "ROOT-A"
uuid = "9f36aa12-4b29-4e3d-9b1a-2d4ce85f71a0"

[[volume]]
name = "ROOT-B"
uuid = "3a80df27-6c14-49b7-a526-1f9de3b4c802"

[luks]
preserve_non_tpm_slots = true
require_recovery_slot = true
minimum_recovery_slots = 1

[audit]
event_log = true
luks_dump = true
header_backup = true
# Must be an existing, protected location outside the runtime state directory.
# Prefer storage independent of the LUKS volumes being modified.
header_backup_dir = "/mnt/secure-backup/tpm-luks"
journal = true
