name: Native packages

on:
  pull_request:
  workflow_dispatch:

jobs:
  rpm-fedora:
    name: RPM - Fedora
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build tools
        run: |
          dnf -y install \
            git gzip rpm-build pyproject-rpm-macros \
            python3-devel python3-pip python3-setuptools python3-wheel
      - uses: actions/checkout@v5
      - name: Build RPM
        run: sh packaging/build-rpm.sh
      - name: Inspect RPM
        run: |
          rpm -qpl dist/rpm/tpm-luks-tool-*.noarch.rpm
          rpm -qpR dist/rpm/tpm-luks-tool-*.noarch.rpm
          rpm -qpR dist/rpm/tpm-luks-tool-*.noarch.rpm | grep -Eq '^python3 >= 3\.11$'
          ! rpm -qpl dist/rpm/tpm-luks-tool-*.noarch.rpm | grep -q '^/var/lib/tpm-luks'
          rpm -qpl dist/rpm/tpm-luks-tool-*.noarch.rpm | grep -q '/usr/lib/tmpfiles.d/tpm-luks.conf'
      - name: Install and smoke test RPM
        run: |
          dnf -y install dist/rpm/tpm-luks-tool-*.noarch.rpm
          tpm-luks --help
          test -f /etc/tpm-luks.toml
          test "$(stat -c '%a:%U:%G' /var/lib/tpm-luks)" = "700:root:root"
          test "$(stat -c '%a:%U:%G' /var/lib/tpm-luks/history)" = "700:root:root"
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fedora
          path: dist/rpm/*

  rpm-rocky9:
    name: RPM - Rocky Linux 9
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: Enable build repositories
        run: |
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled crb
      - name: Install build tools
        run: |
          dnf -y install \
            git gzip rpm-build pyproject-rpm-macros \
            python3.11-devel python3.11-pip python3.11-setuptools \
            python3.11-wheel python3.11-rpm-macros
      - uses: actions/checkout@v5
      - name: Build RPM
        run: sh packaging/build-rpm.sh
      - name: Inspect RPM
        run: |
          rpm -qpl dist/rpm/tpm-luks-tool-*.noarch.rpm
          rpm -qpR dist/rpm/tpm-luks-tool-*.noarch.rpm
          rpm -qpR dist/rpm/tpm-luks-tool-*.noarch.rpm | grep -Eq '^python3\.11 >= 3\.11$'
          ! rpm -qpl dist/rpm/tpm-luks-tool-*.noarch.rpm | grep -q '^/var/lib/tpm-luks'
          rpm -qpl dist/rpm/tpm-luks-tool-*.noarch.rpm | grep -q '/usr/lib/tmpfiles.d/tpm-luks.conf'
      - name: Install and smoke test RPM
        run: |
          dnf -y install dist/rpm/tpm-luks-tool-*.noarch.rpm
          tpm-luks --help
          test -f /etc/tpm-luks.toml
          test "$(stat -c '%a:%U:%G' /var/lib/tpm-luks)" = "700:root:root"
          test "$(stat -c '%a:%U:%G' /var/lib/tpm-luks/history)" = "700:root:root"
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-rocky9
          path: dist/rpm/*

  deb-debian12:
    name: DEB - Debian 12
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates debhelper dh-python dpkg-dev fakeroot git \
            pybuild-plugin-pyproject python3-all python3-setuptools python3-wheel
      - uses: actions/checkout@v5
      - name: Build DEB
        run: sh packaging/build-deb.sh
      - name: Inspect DEB
        run: |
          dpkg-deb --info dist/deb/tpm-luks-tool_*_all.deb
          dpkg-deb --contents dist/deb/tpm-luks-tool_*_all.deb
          dpkg-deb --field dist/deb/tpm-luks-tool_*_all.deb Depends | grep -q 'python3 (>= 3.11)'
          ! dpkg-deb --contents dist/deb/tpm-luks-tool_*_all.deb | grep -q './var/lib/tpm-luks'
          dpkg-deb --contents dist/deb/tpm-luks-tool_*_all.deb | grep -q './usr/lib/tmpfiles.d/tpm-luks.conf'
      - name: Install and smoke test DEB
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/deb/tpm-luks-tool_*_all.deb
          tpm-luks --help
          test -f /etc/tpm-luks.toml
          test "$(stat -c '%a:%U:%G' /var/lib/tpm-luks)" = "700:root:root"
          test "$(stat -c '%a:%U:%G' /var/lib/tpm-luks/history)" = "700:root:root"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-debian12
          path: dist/deb/*

  deb-ubuntu2404:
    name: DEB - Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python dpkg-dev fakeroot \
            pybuild-plugin-pyproject python3-all python3-setuptools python3-wheel
      - name: Build DEB
        run: sh packaging/build-deb.sh
      - name: Inspect DEB
        run: |
          dpkg-deb --info dist/deb/tpm-luks-tool_*_all.deb
          dpkg-deb --contents dist/deb/tpm-luks-tool_*_all.deb
          dpkg-deb --field dist/deb/tpm-luks-tool_*_all.deb Depends | grep -q 'python3 (>= 3.11)'
          ! dpkg-deb --contents dist/deb/tpm-luks-tool_*_all.deb | grep -q './var/lib/tpm-luks'
          dpkg-deb --contents dist/deb/tpm-luks-tool_*_all.deb | grep -q './usr/lib/tmpfiles.d/tpm-luks.conf'
      - name: Install and smoke test DEB
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/deb/tpm-luks-tool_*_all.deb
          tpm-luks --help
          test -f /etc/tpm-luks.toml
          test "$(sudo stat -c '%a:%U:%G' /var/lib/tpm-luks)" = "700:root:root"
          test "$(sudo stat -c '%a:%U:%G' /var/lib/tpm-luks/history)" = "700:root:root"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-ubuntu2404
          path: dist/deb/*
