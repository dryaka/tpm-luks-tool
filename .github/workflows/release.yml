name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate upstream and native versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python packaging/release.py validate "$RELEASE_TAG"
      - name: Require successful main CI on this exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const repo = context.repo;
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              ...repo, basehead: `${sha}...main`
            });
            if (!['ahead', 'identical'].includes(comparison.data.status)) {
              throw new Error('Tagged commit must belong to main history');
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...repo, workflow_id: 'ci.yml', head_sha: sha, branch: 'main', per_page: 100
            });
            const candidates = runs.filter(run =>
              run.head_sha === sha && run.head_branch === 'main' &&
              ['push', 'workflow_dispatch'].includes(run.event)
            ).sort((a, b) => b.id - a.id);
            // Use the newest run, never an older success hiding a later failure.
            const run = candidates[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              throw new Error(`No successful latest main CI for ${sha}`);
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repo, run_id: run.id, filter: 'latest', per_page: 100
            });
            const test = jobs.find(job => job.name === 'test' && job.head_sha === sha);
            if (!test || test.conclusion !== 'success' ||
                !['Compile', 'Unit tests'].every(name =>
                  test.steps?.some(step => step.name === name && step.conclusion === 'success'))) {
              throw new Error('CI test job must actually execute Compile and Unit tests successfully');
            }
            await core.summary.addRaw(`Validated commit: ${sha}\n\nCI evidence: ${run.html_url}\n`).write();

  packages:
    needs: validate
    uses: ./.github/workflows/packages.yml

  publish:
    needs: [validate, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare packages and checksums
        run: python packaging/release.py stage artifacts release-assets
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Refuse a moved tag, including annotated tags resolving elsewhere.
          test "$(gh api "repos/$GH_REPO/commits/refs/tags/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          printf 'Built from commit `%s`.\n\nBuild: %s/%s/actions/runs/%s\n\nVerify downloaded packages with `sha256sum -c SHA256SUMS`.\n' \
            "$RELEASE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release-notes.md
          # Existing releases are never overwritten. Failed uploads stay draft.
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false
